schema_version = 1

[project]
id = "girlscreation"
name = "少女艺术绮谭"
source_language = "ja"
adapter = "scripts.games.girlscreation.adapter"
backend = "deepseek"
sources = ".cache/translation/girlscreation/sources"

[adapter]
master_fields = "scripts/games/girlscreation/resources/master-fields.json"

[backends.deepseek]
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
model = "deepseek-flash"

[backends.deepseek.codex]
effort = "high"
# Token budget within the provider's documented 1M context limit.
context_window = 1_000_000

[backends.openai]
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
# Select your model with TRANSLATION_MODEL or --model.

[targets.zh-Hans]
name = "简体中文"
style = "scripts/games/girlscreation/resources/zh-Hans.style.md"
